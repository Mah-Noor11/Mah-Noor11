<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="hero.svg"><title>hero.svg</title><defs><linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101914"/><stop offset=".58" stop-color="#1b2a21"/><stop offset="1" stop-color="#111a15"/></linearGradient><linearGradient id="accent"><stop stop-color="#819b6c"/><stop offset=".5" stop-color="#c2d7a0"/><stop offset="1" stop-color="#789568"/></linearGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#93ad85" opacity=".12"/></pattern><clipPath id="typing"><rect x="0" y="0" width="0" height="90"><animate attributeName="width" values="0;0;580;580;0" keyTimes="0;.06;.35;.88;1" dur="9s" repeatCount="indefinite"/></rect></clipPath></defs><style><![CDATA[.orbit{transform-origin:840px 184px;animation:spin 29s linear infinite}.pulse{animation:pulse 3.8s ease-in-out infinite}.node{animation:float 5s ease-in-out infinite}.dash{stroke-dasharray:8 12;animation:dash 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.32}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes dash{to{stroke-dashoffset:-360}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><rect width="1000" height="310" rx="22" fill="url(#base)"/><rect width="1000" height="310" rx="22" fill="url(#dots)"/><rect x="1" y="1" width="998" height="308" rx="21" stroke="#4d624b" fill="none"/><path d="M0 257 Q260 220 510 267 T1000 255" stroke="#5b755a" stroke-width="2" opacity=".45" fill="none"/><path class="dash" d="M0 272 Q230 241 520 274 T1000 266" stroke="#b6ce9a" stroke-width="2" opacity=".65" fill="none"/><rect x="48" y="37" width="168" height="30" rx="15" fill="#2d4031"/><circle cx="65" cy="52" r="5" fill="#b8ce99" class="pulse"/><text x="80" y="57" fill="#c9d8b7" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">HELLO, I'M</text><text x="48" y="155" fill="#71886f" opacity=".62" font-size="74" font-family="Arial,sans-serif" font-weight="700">Mah Noor</text><text x="48" y="155" fill="#f0f4eb" font-size="74" font-family="Arial,sans-serif" font-weight="700" clip-path="url(#typing)">Mah Noor</text><rect x="49" y="171" width="275" height="3" fill="url(#accent)"/><text x="48" y="212" fill="#c4d5b3" font-size="21" font-family="Arial,sans-serif" letter-spacing="1">DATA  /  MACHINE LEARNING  /  RESEARCH</text><text x="48" y="242" fill="#a4b9a4" font-size="15" font-family="Arial,sans-serif">Curiosity-driven. Evidence-led. Always learning.</text><g class="orbit"><circle cx="840" cy="155" r="104" stroke="#6c8a69" stroke-width="1" stroke-dasharray="3 8" fill="none"/><circle cx="840" cy="155" r="73" stroke="#72936c" stroke-width="1.2" fill="none"/><circle cx="840" cy="51" r="7" fill="#c2d6a3"/><circle cx="913" cy="155" r="6" fill="#b1c792"/><circle cx="768" cy="155" r="4" fill="#829d77"/></g><g class="node"><path d="M825 112 L861 134 L861 176 L825 198 L789 176 L789 134Z" fill="#314a35" stroke="#b9d19c" stroke-width="2"/><text x="825" y="163" fill="#f5f8ee" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle">MN</text></g></svg>